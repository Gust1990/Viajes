<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Ganancias Uber</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="min-h-screen bg-cover bg-center bg-fixed font-sans text-gray-900 p-4 md:p-8" 
      style="background-image: url('https://images.unsplash.com/photo-1499856871958-5b9627545d1a?q=80&w=2020&auto=format&fit=crop');">

    <div class="max-w-4xl mx-auto flex flex-col md:flex-row gap-6">
        
        <!-- Columna Izquierda: Calculadora -->
        <div class="w-full md:w-1/2 flex flex-col gap-6">
            
            <div class="glass p-6 rounded-3xl shadow-xl text-center border-t-4 border-t-green-500">
                <h1 class="text-3xl font-black text-gray-900 mb-1"><i class="fa-brands fa-uber text-black"></i> Rentabilidad</h1>
                <p class="text-sm text-gray-600 font-medium">Calcula tu ganancia neta por viaje</p>
            </div>

            <div class="glass p-6 rounded-3xl shadow-lg">
                <h2 class="text-lg font-bold mb-4 text-gray-800"><i class="fa-solid fa-calculator text-blue-500"></i> Datos del Viaje</h2>
                
                <div class="grid grid-cols-2 gap-4 mb-5">
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1 uppercase tracking-wide">Distancia (km)</label>
                        <input type="number" id="distancia" step="0.1" oninput="guardarBorrador()" class="w-full p-4 rounded-xl border-none shadow-inner bg-gray-50 text-center font-black text-2xl focus:ring-2 focus:ring-green-400 outline-none transition" placeholder="0">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-700 mb-1 uppercase tracking-wide">Pago Uber ($)</label>
                        <input type="number" id="precio_uber" oninput="guardarBorrador()" class="w-full p-4 rounded-xl border-none shadow-inner bg-gray-50 text-center font-black text-2xl text-blue-700 focus:ring-2 focus:ring-blue-400 outline-none transition" placeholder="0">
                    </div>
                </div>

                <details class="bg-white/60 rounded-xl mb-4 group shadow-sm border border-gray-100">
                    <summary class="text-xs font-bold text-gray-700 p-3 cursor-pointer hover:bg-white/80 rounded-xl transition flex justify-between items-center">
                        <span><i class="fa-solid fa-gear text-gray-500 mr-1"></i> Costos del Vehículo (GNC + 40%)</span>
                        <i class="fa-solid fa-chevron-down text-gray-400 text-[10px]"></i>
                    </summary>
                    <div class="p-4 pt-2 grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-[10px] font-bold text-gray-600 mb-1">Precio GNC ($/m3)</label>
                            <input type="number" id="precio_gnc" oninput="guardarAjustes()" class="w-full p-2 rounded-lg shadow-inner bg-gray-50 text-center text-sm font-semibold border-none" value="1000">
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-gray-600 mb-1">Rendimiento (km/m3)</label>
                            <input type="number" id="rendimiento" oninput="guardarAjustes()" class="w-full p-2 rounded-lg shadow-inner bg-gray-50 text-center text-sm font-semibold border-none" value="10">
                        </div>
                    </div>
                </details>

                <button onclick="calcularGanancia()" class="w-full bg-black text-white font-black py-4 rounded-xl hover:bg-gray-800 transition shadow-xl text-lg transform hover:scale-[1.02]">
                    CALCULAR GANANCIA
                </button>
            </div>
        </div>

        <!-- Columna Derecha: Resultados y Registo -->
        <div class="w-full md:w-1/2 flex flex-col gap-6">
            
            <div id="resultado-box" class="glass p-6 md:p-8 rounded-3xl shadow-xl flex flex-col text-center hidden relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-green-400 to-blue-500"></div>
                
                <h2 class="text-xl font-bold mb-5 text-gray-800 uppercase tracking-widest text-sm">Resumen Financiero</h2>
                
                <div class="flex flex-col gap-3 mb-6">
                    <div class="flex justify-between items-center bg-white/70 p-3 rounded-lg shadow-sm">
                        <span class="text-sm font-semibold text-gray-600"><i class="fa-brands fa-uber text-black w-5"></i> Ingreso Bruto</span>
                        <span id="res-ingreso" class="font-black text-lg text-gray-900">$0</span>
                    </div>
                    <div class="flex justify-between items-center bg-red-50/70 p-3 rounded-lg shadow-sm border border-red-100">
                        <span class="text-sm font-semibold text-red-600"><i class="fa-solid fa-gas-pump w-5"></i> Costo Operativo (GNC+40%)</span>
                        <span id="res-costo" class="font-black text-lg text-red-600">-$0</span>
                    </div>
                </div>

                <div id="veredicto-container" class="w-full p-5 rounded-2xl text-white font-black text-2xl shadow-inner flex flex-col justify-center items-center">
                    <span class="text-xs uppercase tracking-widest font-bold opacity-80 mb-1">Ganancia Neta (Bolsillo)</span>
                    <span id="res-neta" class="text-4xl drop-shadow-md">$0</span>
                    <span id="res-margen" class="text-sm font-semibold bg-white/20 px-3 py-1 rounded-full mt-2 hidden">Margen: 0%</span>
                </div>
            </div>

            <div class="glass p-6 rounded-3xl shadow-lg flex-grow">
                <h2 class="text-sm font-bold mb-4 uppercase tracking-widest text-gray-700"><i class="fa-solid fa-list-ul text-blue-500 mr-1"></i> Registro de Viajes</h2>
                <div id="historial-lista" class="flex flex-col gap-3 max-h-[300px] overflow-y-auto pr-2">
                    <p class="text-sm text-gray-500 text-center italic mt-4">Aún no hay viajes registrados.</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        window.onload = () => {
            cargarAjustes();
            cargarBorrador();
            cargarHistorial();
        };

        function guardarAjustes() {
            const ajustes = {
                gnc: document.getElementById('precio_gnc').value,
                rendimiento: document.getElementById('rendimiento').value
            };
            localStorage.setItem('uberDriverAjustes', JSON.stringify(ajustes));
        }

        function cargarAjustes() {
            const ajustes = JSON.parse(localStorage.getItem('uberDriverAjustes'));
            if (ajustes) {
                if(ajustes.gnc) document.getElementById('precio_gnc').value = ajustes.gnc;
                if(ajustes.rendimiento) document.getElementById('rendimiento').value = ajustes.rendimiento;
            }
        }

        function guardarBorrador() {
            const borrador = {
                distancia: document.getElementById('distancia').value,
                precio_uber: document.getElementById('precio_uber').value
            };
            localStorage.setItem('uberDriverBorrador', JSON.stringify(borrador));
        }

        function cargarBorrador() {
            const borrador = JSON.parse(localStorage.getItem('uberDriverBorrador'));
            if (borrador) {
                if(borrador.distancia) document.getElementById('distancia').value = borrador.distancia;
                if(borrador.precio_uber) document.getElementById('precio_uber').value = borrador.precio_uber;
            }
        }

        function formatMonto(monto) {
            return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' }).format(monto);
        }

        function autocompletarDesdeHistorial(distancia) {
            document.getElementById('distancia').value = distancia;
            document.getElementById('precio_uber').value = ""; 
            document.getElementById('precio_uber').focus();
            guardarBorrador();
        }

        function calcularGanancia() {
            const distancia = parseFloat(document.getElementById('distancia').value);
            const tarifa_uber = parseFloat(document.getElementById('precio_uber').value);
            const precio_gnc = parseFloat(document.getElementById('precio_gnc').value);
            const rendimiento = parseFloat(document.getElementById('rendimiento').value);

            if (!distancia || distancia <= 0 || !tarifa_uber || tarifa_uber <= 0) {
                alert("Por favor, ingresa los kilómetros del viaje y el pago de Uber.");
                return;
            }

            // Costo operativo: GNC gastado + 40% de mantenimiento
            const costo_operativo = ((distancia / rendimiento) * precio_gnc) * 1.40;
            const ganancia_neta = tarifa_uber - costo_operativo;
            const margen_porcentaje = ((ganancia_neta / tarifa_uber) * 100).toFixed(0);

            // Actualizar Interfaz
            document.getElementById('resultado-box').classList.remove('hidden');
            document.getElementById('res-ingreso').innerText = formatMonto(tarifa_uber);
            document.getElementById('res-costo').innerText = "-" + formatMonto(costo_operativo);
            
            const veredictoCont = document.getElementById('veredicto-container');
            const resNeta = document.getElementById('res-neta');
            const resMargen = document.getElementById('res-margen');

            resNeta.innerText = formatMonto(ganancia_neta);
            resMargen.innerText = `Margen de ganancia: ${margen_porcentaje}%`;
            resMargen.classList.remove('hidden');

            if (ganancia_neta > 0) {
                veredictoCont.className = "w-full p-5 rounded-2xl text-white font-black text-2xl shadow-inner flex flex-col justify-center items-center bg-green-500";
            } else {
                veredictoCont.className = "w-full p-5 rounded-2xl text-white font-black text-2xl shadow-inner flex flex-col justify-center items-center bg-red-500";
                resMargen.innerText = "VIAJE A PÉRDIDA";
            }

            guardarViaje(distancia, tarifa_uber, costo_operativo, ganancia_neta);
        }

        function guardarViaje(distancia, ingreso, costo, neta) {
            let historial = JSON.parse(localStorage.getItem('uberDriverHistorial')) || [];
            
            const nuevoViaje = {
                fecha: new Date().toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' }),
                distancia: distancia,
                ingreso: ingreso,
                costo: costo,
                neta: neta
            };

            historial.unshift(nuevoViaje); 
            if (historial.length > 10) historial.pop();

            localStorage.setItem('uberDriverHistorial', JSON.stringify(historial));
            cargarHistorial();
        }

        function cargarHistorial() {
            const lista = document.getElementById('historial-lista');
            let historial = JSON.parse(localStorage.getItem('uberDriverHistorial')) || [];
            
            if (historial.length === 0) return;

            lista.innerHTML = '';
            historial.forEach(v => {
                const esPositivo = v.neta > 0;
                const colorNeta = esPositivo ? 'text-green-600' : 'text-red-600';
                const bgIcon = esPositivo ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600';

                const html = `
                <div onclick="autocompletarDesdeHistorial(${v.distancia})" class="bg-white/90 p-3 rounded-xl shadow-sm border border-gray-100 flex justify-between items-center cursor-pointer hover:bg-gray-50 hover:scale-[1.02] transition transform">
                    <div class="flex items-center gap-3 w-full">
                        <div class="${bgIcon} w-10 h-10 rounded-full flex items-center justify-center font-bold text-sm shrink-0">
                            ${v.distancia}k
                        </div>
                        <div class="flex-grow">
                            <div class="flex justify-between items-center">
                                <p class="text-xs font-bold text-gray-500 uppercase">${v.fecha}</p>
                                <span class="font-black text-sm ${colorNeta}">${formatMonto(v.neta)}</span>
                            </div>
                            <div class="flex justify-between text-[11px] font-medium mt-1">
                                <span class="text-gray-700">Cobrado: ${formatMonto(v.ingreso)}</span>
                                <span class="text-red-500">Costo: ${formatMonto(v.costo)}</span>
                            </div>
                        </div>
                    </div>
                </div>`;
                lista.innerHTML += html;
            });
        }
    </script>
</body>
</html>
