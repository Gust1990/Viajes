<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNC vs Uber vs Colectivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen bg-cover bg-center bg-fixed font-sans text-gray-800 p-4 md:p-8" 
      style="background-image: url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?q=80&w=2070&auto=format&fit=crop');">

    <div class="max-w-6xl mx-auto flex flex-col lg:flex-row gap-6">
        
        <div class="w-full lg:w-1/3 flex flex-col gap-6">
            
            <div class="glass p-6 rounded-3xl shadow-lg text-center">
                <h1 class="text-3xl font-bold text-gray-900 mb-2"><i class="fa-solid fa-route text-green-600"></i> Mi Viaje</h1>
                <p class="text-sm text-gray-600">Compara Auto, Uber y Colectivo</p>
            </div>

            <div class="glass p-6 rounded-3xl shadow-lg">
                <h2 class="text-lg font-semibold mb-4"><i class="fa-solid fa-location-dot text-red-500"></i> Tu Ruta</h2>
                
                <div class="mb-4">
                    <label class="block text-xs font-medium text-gray-700 mb-1">Origen</label>
                    <input type="text" id="origen" placeholder="Ej: San Miguel de Tucumán" class="w-full p-2 rounded-xl border-none shadow-inner bg-white/80 focus:ring-2 focus:ring-green-400 outline-none">
                </div>

                <div>
                    <label class="block text-xs font-medium text-gray-700 mb-1">Destino</label>
                    <input type="text" id="destino" placeholder="Ej: Terminal de Ómnibus" class="w-full p-2 rounded-xl border-none shadow-inner bg-white/80 focus:ring-2 focus:ring-green-400 outline-none">
                </div>
            </div>

            <div class="glass p-6 rounded-3xl shadow-lg">
                <h2 class="text-lg font-semibold mb-4"><i class="fa-solid fa-wallet text-yellow-600"></i> Datos del Viaje</h2>
                
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Distancia (km)</label>
                        <input type="number" id="distancia" step="0.1" class="w-full p-2 rounded-xl border-none shadow-inner bg-white/80 text-center font-bold text-lg" value="0">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-700 mb-1">Tarifa Uber ($)</label>
                        <input type="number" id="precio_uber" class="w-full p-2 rounded-xl border-none shadow-inner bg-white/80 text-center font-bold text-lg text-blue-600" placeholder="0">
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2 mb-2">
                    <div>
                        <label class="block text-[10px] font-medium text-gray-700 mb-1">Precio GNC ($)</label>
                        <input type="number" id="precio_gnc" oninput="guardarAjustes()" class="w-full p-2 rounded-xl border-none shadow-inner bg-white/80 text-center text-sm" value="1000">
                    </div>
                    <div>
                        <label class="block text-[10px] font-medium text-gray-700 mb-1">Rend. (km/m3)</label>
                        <input type="number" id="rendimiento" oninput="guardarAjustes()" class="w-full p-2 rounded-xl border-none shadow-inner bg-white/80 text-center text-sm" value="10">
                    </div>
                    <div>
                        <label class="block text-[10px] font-medium text-gray-700 mb-1">Boleto Col. ($)</label>
                        <input type="number" id="precio_colectivo" oninput="guardarAjustes()" class="w-full p-2 rounded-xl border-none shadow-inner bg-white/80 text-center text-sm" value="690">
                    </div>
                </div>
                
                <p class="text-[10px] text-gray-500 leading-tight mt-2">* Costo Auto = GNC + 20% extra. Costo Colectivo = Boleto + 5% extra.</p>
            </div>
            
            <button onclick="comparar()" class="w-full bg-gray-900 text-white font-bold py-3 rounded-xl hover:bg-gray-800 transition shadow-lg text-lg">
                Comparar Costos
            </button>
        </div>

        <div class="w-full lg:w-2/3 flex flex-col gap-6">
            
            <div id="resultado-box" class="glass p-6 md:p-8 rounded-3xl shadow-lg flex flex-col items-center justify-center text-center hidden">
                <h2 class="text-2xl font-bold mb-6 text-gray-800">Resumen de Costos</h2>
                
                <div class="flex flex-col md:flex-row w-full justify-between items-center gap-3 mb-6">
                    <div class="bg-white/60 p-4 rounded-2xl w-full shadow-sm border border-white">
                        <p class="text-sm font-semibold text-gray-600 mb-1"><i class="fa-solid fa-car text-green-600"></i> Auto</p>
                        <p id="res-auto" class="text-2xl font-bold text-gray-800">$0</p>
                    </div>
                    <div class="bg-white/60 p-4 rounded-2xl w-full shadow-sm border border-white">
                        <p class="text-sm font-semibold text-gray-600 mb-1"><i class="fa-brands fa-uber text-black"></i> Uber</p>
                        <p id="res-uber" class="text-2xl font-bold text-gray-800">$0</p>
                    </div>
                    <div class="bg-white/60 p-4 rounded-2xl w-full shadow-sm border border-white">
                        <p class="text-sm font-semibold text-gray-600 mb-1"><i class="fa-solid fa-bus text-blue-500"></i> Colectivo</p>
                        <p id="res-colectivo" class="text-2xl font-bold text-gray-800">$0</p>
                    </div>
                </div>

                <div id="veredicto-container" class="w-full p-4 rounded-xl text-white font-bold text-xl shadow-md">
                </div>
            </div>

            <div class="glass p-6 rounded-3xl shadow-lg flex-grow">
                <h2 class="text-lg font-semibold mb-4"><i class="fa-solid fa-clock-rotate-left text-blue-500"></i> Últimos Viajes Guardados</h2>
                <div id="historial-lista" class="flex flex-col gap-3">
                    <p class="text-sm text-gray-500 text-center italic mt-4">Aún no hay viajes guardados.</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        window.onload = () => {
            cargarAjustes();
            cargarHistorial();
        };

        function guardarAjustes() {
            const ajustes = {
                gnc: document.getElementById('precio_gnc').value,
                rendimiento: document.getElementById('rendimiento').value,
                colectivo: document.getElementById('precio_colectivo').value
            };
            localStorage.setItem('viajeAjustesOSM2', JSON.stringify(ajustes));
        }

        function cargarAjustes() {
            const ajustes = JSON.parse(localStorage.getItem('viajeAjustesOSM2'));
            if (ajustes) {
                if(ajustes.gnc) document.getElementById('precio_gnc').value = ajustes.gnc;
                if(ajustes.rendimiento) document.getElementById('rendimiento').value = ajustes.rendimiento;
                if(ajustes.colectivo) document.getElementById('precio_colectivo').value = ajustes.colectivo;
            }
        }

        function formatMonto(monto) {
            return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' }).format(monto);
        }

        function comparar() {
            const origen = document.getElementById('origen').value || "Origen manual";
            const destino = document.getElementById('destino').value || "Destino manual";
            const distancia = parseFloat(document.getElementById('distancia').value);
            const precio_uber = parseFloat(document.getElementById('precio_uber').value);
            const precio_gnc = parseFloat(document.getElementById('precio_gnc').value);
            const rendimiento = parseFloat(document.getElementById('rendimiento').value);
            const precio_colectivo_base = parseFloat(document.getElementById('precio_colectivo').value);

            if (!distancia || distancia <= 0 || !precio_uber || precio_uber <= 0 || !precio_colectivo_base) {
                alert("Por favor, completa la distancia, tarifa de Uber y Boleto.");
                return;
            }

            const costo_auto = ((distancia / rendimiento) * precio_gnc) * 1.20;
            const costo_colectivo = precio_colectivo_base * 1.05;

            document.getElementById('resultado-box').classList.remove('hidden');
            document.getElementById('res-auto').innerText = formatMonto(costo_auto);
            document.getElementById('res-uber').innerText = formatMonto(precio_uber);
            document.getElementById('res-colectivo').innerText = formatMonto(costo_colectivo);

            const opciones = [
                { nombre: 'Auto', costo: costo_auto, icon: 'fa-car', color: 'bg-green-500' },
                { nombre: 'Uber', costo: precio_uber, icon: 'fa-uber', color: 'bg-black' },
                { nombre: 'Colectivo', costo: costo_colectivo, icon: 'fa-bus', color: 'bg-blue-500' }
            ];
            
            opciones.sort((a, b) => a.costo - b.costo);
            const ganador = opciones[0];
            const segundo = opciones[1];
            const ahorro = segundo.costo - ganador.costo;

            const veredictoCont = document.getElementById('veredicto-container');
            veredictoCont.className = `w-full p-4 rounded-xl text-white font-bold text-xl shadow-md ${ganador.color}`;
            veredictoCont.innerHTML = `<i class="fa-solid ${ganador.icon}"></i> Conviene ir en ${ganador.nombre}.<br><span class="text-sm font-normal">Ahorras ${formatMonto(ahorro)} respecto a la segunda mejor opción.</span>`;

            guardarViaje(origen, destino, costo_auto, precio_uber, costo_colectivo, ganador.nombre);
        }

        function guardarViaje(origen, destino, costoAuto, costoUber, costoColectivo, ganador) {
            let historial = JSON.parse(localStorage.getItem('gncUberHistorial')) || [];
            
            const nuevoViaje = {
                fecha: new Date().toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' }),
                origen: origen,
                destino: destino,
                auto: costoAuto,
                uber: costoUber,
                colectivo: costoColectivo,
                ganador: ganador
            };

            historial.unshift(nuevoViaje); 
            if (historial.length > 4) historial.pop();

            localStorage.setItem('gncUberHistorial', JSON.stringify(historial));
            cargarHistorial();
        }

        function cargarHistorial() {
            const lista = document.getElementById('historial-lista');
            let historial = JSON.parse(localStorage.getItem('gncUberHistorial')) || [];
            
            if (historial.length === 0) return;

            lista.innerHTML = '';
            historial.forEach(v => {
                let badgeColor = '';
                if(v.ganador === 'Auto') badgeColor = 'bg-green-100 text-green-700';
                else if(v.ganador === 'Uber') badgeColor = 'bg-gray-200 text-gray-800';
                else badgeColor = 'bg-blue-100 text-blue-700';

                const html = `
                <div class="bg-white/80 p-3 rounded-xl shadow-sm border border-white flex justify-between items-center">
                    <div class="w-full">
                        <div class="flex justify-between items-start w-full">
                            <p class="text-xs font-bold text-gray-800 truncate"><i class="fa-solid fa-map-pin text-red-500 mr-1"></i> ${v.destino}</p>
                            <span class="px-2 py-0.5 ml-2 rounded-md text-[10px] font-bold ${badgeColor} whitespace-nowrap">${v.ganador}</span>
                        </div>
                        <p class="text-[10px] text-gray-500 truncate mb-1">Desde: ${v.origen}</p>
                        
                        <div class="flex gap-3 text-[10px] font-medium mt-2 bg-gray-50 p-1.5 rounded-lg border">
                            <span class="${v.ganador === 'Auto' ? 'font-bold text-green-700' : 'opacity-70'}"><i class="fa-solid fa-car"></i> ${formatMonto(v.auto)}</span>
                            <span class="${v.ganador === 'Uber' ? 'font-bold text-black' : 'opacity-70'}"><i class="fa-brands fa-uber"></i> ${formatMonto(v.uber)}</span>
                            <span class="${v.ganador === 'Colectivo' ? 'font-bold text-blue-700' : 'opacity-70'}"><i class="fa-solid fa-bus"></i> ${formatMonto(v.colectivo)}</span>
                        </div>
                    </div>
                </div>`;
                lista.innerHTML += html;
            });
        }
    </script>
</body>
</html>
